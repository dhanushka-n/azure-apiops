
# APIM Shared Policies - Build Pipeline
# Manual build initially; CI will be enabled later.

name: '$(Date:yyyyMMdd).$(Rev:r)'

trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build APIM Shared Policies'
  jobs:
  - job: Package
    displayName: 'Validate and Package APIOps Artifacts'

    steps:
    - checkout: self
      clean: true

    - pwsh: |
        & "$(Build.SourcesDirectory)/scripts/build-artifacts.ps1" `
          -RepoRoot "$(Build.SourcesDirectory)" `
          -OutputRoot "$(Build.ArtifactStagingDirectory)/apim-shared-policies"
      displayName: 'Validate XML and Generate Artifacts'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Versioned APIOps Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/apim-shared-policies'
        ArtifactName: 'apim-shared-policies'
        publishLocation: 'Container'
